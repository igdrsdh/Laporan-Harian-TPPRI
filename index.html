<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laporan Rawat Inap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.4s, color 0.4s;
        }

        /* Tombol + / - */
        .counter-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            border: none;
        }
        .counter-btn:active {
            transform: scale(0.85);
        }
        .counter-btn.minus {
            background: #fef2f2;
            color: #dc2626;
        }
        .counter-btn.minus:hover {
            background: #fecaca;
            transform: scale(1.08);
        }
        .counter-btn.plus {
            background: #f0fdf4;
            color: #16a34a;
        }
        .counter-btn.plus:hover {
            background: #bbf7d0;
            transform: scale(1.08);
        }
        .dark .counter-btn.minus {
            background: #450a0a;
            color: #f87171;
        }
        .dark .counter-btn.minus:hover {
            background: #7f1d1d;
        }
        .dark .counter-btn.plus {
            background: #052e16;
            color: #4ade80;
        }
        .dark .counter-btn.plus:hover {
            background: #14532d;
        }

        /* Tampilan nilai */
        .value-display {
            min-width: 34px;
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            color: #0f172a;
            transition: all 0.15s;
        }
        .dark .value-display {
            color: #f1f5f9;
        }

        /* Kartu section */
        .section-card {
            transition: all 0.25s ease;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
        }
        .section-card:hover {
            border-color: #cbd5e1;
        }
        .dark .section-card {
            border-color: #1e293b;
        }
        .dark .section-card:hover {
            border-color: #334155;
        }

        /* Header - cursor pointer di seluruh area, kecuali ikon */
        .section-header {
            transition: all 0.2s;
            cursor: pointer;
            border-radius: 18px 18px 0 0;
            background: transparent;
        }
        .section-header:hover {
            background: #f8fafc;
        }
        .dark .section-header:hover {
            background: #1e293b;
        }

        /* Output laporan */
        .output-box {
            background: linear-gradient(145deg, #0f172a, #1e293b);
            color: #34d399;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.9;
            padding: 20px;
            border-radius: 14px;
            min-height: 250px;
            max-height: 450px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid #1e293b;
        }
        @media (min-width: 640px) {
            .output-box {
                font-size: 13px;
                padding: 24px;
                min-height: 280px;
                max-height: 520px;
            }
        }
        .output-box::-webkit-scrollbar {
            width: 5px;
        }
        .output-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .output-box::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .dark .output-box {
            background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
            border-color: #1a1a1a;
        }

        /* Collapsible - default tertutup */
        .collapsible-content {
            display: none;
        }
        .collapsible-content.expanded {
            display: block;
            animation: fadeSlide 0.25s ease-out forwards;
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Item input */
        .item-label {
            font-size: 10px;
            font-weight: 600;
            line-height: 1.2;
            flex: 1;
            min-width: 35px;
            color: #334155;
            letter-spacing: 0.2px;
        }
        @media (min-width: 400px) {
            .item-label {
                font-size: 11px;
                min-width: 45px;
            }
        }
        .dark .item-label {
            color: #cbd5e1;
        }

        .item-box {
            background: #fafafa;
            border: 1px solid #e8ecf0;
            border-radius: 12px;
            padding: 4px 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }
        .item-box:hover {
            border-color: #94a3b8;
            background: #f8fafc;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .dark .item-box {
            background: #1e293b;
            border-color: #2d3a4f;
        }
        .dark .item-box:hover {
            border-color: #475569;
            background: #253040;
        }

        /* Panah toggle - cursor default (tidak berubah jadi tangan) */
        .toggle-arrow {
            transition: transform 0.35s ease;
            color: #94a3b8;
            flex-shrink: 0;
            cursor: default;
        }
        .toggle-arrow.rotated {
            transform: rotate(180deg);
        }
        .dark .toggle-arrow {
            color: #64748b;
        }

        /* Badge total dengan animasi */
        .badge-total {
            font-size: 12px;
            font-weight: 800;
            padding: 2px 14px;
            border-radius: 30px;
            background: #e0f2fe;
            color: #0284c7;
            flex-shrink: 0;
            transition: all 0.3s ease;
            min-width: 28px;
            text-align: center;
        }
        @media (min-width: 640px) {
            .badge-total {
                font-size: 13px;
                padding: 2px 18px;
            }
        }
        .badge-total:has-text(>0) {
            animation: pulseBadge 0.3s ease;
        }
        @keyframes pulseBadge {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .dark .badge-total {
            background: #0c4a6e;
            color: #7dd3fc;
        }
        .badge-total.green {
            background: #dcfce7;
            color: #16a34a;
        }
        .dark .badge-total.green {
            background: #14532d;
            color: #4ade80;
        }
        .badge-total.purple {
            background: #f3e8ff;
            color: #7c3aed;
        }
        .dark .badge-total.purple {
            background: #3b0764;
            color: #c084fc;
        }

        /* Tombol copy - elegan */
        .btn-copy {
            background: linear-gradient(135deg, #334155, #1e293b);
            color: #f1f5f9;
            padding: 6px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 11px;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .btn-copy:hover {
            background: linear-gradient(135deg, #475569, #1e293b);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        .btn-copy:active {
            transform: scale(0.96) translateY(0);
        }
        @media (min-width: 640px) {
            .btn-copy {
                padding: 8px 24px;
                font-size: 12px;
                border-radius: 14px;
            }
        }
        .dark .btn-copy {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #e2e8f0;
        }
        .dark .btn-copy:hover {
            background: linear-gradient(135deg, #334155, #0f172a);
        }

        /* Header - elegan */
        .header-title {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.3px;
        }
        @media (min-width: 640px) {
            .header-title {
                font-size: 22px;
            }
        }
        .dark .header-title {
            color: #f1f5f9;
        }
        .header-sub {
            font-size: 9px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        @media (min-width: 640px) {
            .header-sub {
                font-size: 11px;
            }
        }
        .dark .header-sub {
            color: #64748b;
        }

        /* Tombol reset */
        .btn-reset {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 0 14px;
            height: 36px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 11px;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.25);
        }
        .btn-reset:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35);
        }
        .btn-reset:active {
            transform: scale(0.96) translateY(0);
        }
        @media (min-width: 640px) {
            .btn-reset {
                padding: 0 20px;
                height: 42px;
                font-size: 13px;
                border-radius: 14px;
                gap: 6px;
            }
        }

        /* Tombol dark mode */
        .btn-dark {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.25s ease;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-dark:hover {
            background: #e2e8f0;
            transform: scale(1.05);
        }
        @media (min-width: 640px) {
            .btn-dark {
                width: 42px;
                height: 42px;
                border-radius: 14px;
                font-size: 20px;
            }
        }
        .dark .btn-dark {
            background: #1e293b;
            border-color: #334155;
        }
        .dark .btn-dark:hover {
            background: #334155;
        }

        /* Input date - lebih halus */
        .input-date {
            width: 100%;
            padding: 10px 16px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            outline: none;
            font-weight: 500;
            font-size: 14px;
            color: #0f172a;
            transition: all 0.25s ease;
        }
        .input-date:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
        }
        @media (min-width: 640px) {
            .input-date {
                padding: 12px 18px;
                border-radius: 14px;
                font-size: 15px;
            }
        }
        .dark .input-date {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }
        .dark .input-date:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
        }

        .label-date {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: block;
            margin-bottom: 4px;
        }
        @media (min-width: 640px) {
            .label-date {
                font-size: 11px;
                margin-bottom: 5px;
            }
        }
        .dark .label-date {
            color: #64748b;
        }

        /* Toast - lebih mulus */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            z-index: 50;
            padding: 12px 24px;
            background: #0f172a;
            color: #f1f5f9;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid #1e293b;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        @media (min-width: 640px) {
            .toast {
                padding: 14px 32px;
                font-size: 14px;
                border-radius: 18px;
                bottom: 32px;
            }
        }
        .dark .toast {
            background: #1e293b;
            color: #e2e8f0;
            border-color: #334155;
        }

        /* GRID: 1 kolom semua */
        .grid-items {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }

        /* SEPARATOR - warna biru */
        .sub-group {
            grid-column: 1 / -1;
            padding: 8px 4px 4px 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2563eb;
            border-bottom: 1.5px solid #93c5fd;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sub-group::before {
            content: "▸";
            font-size: 10px;
            color: #60a5fa;
        }
        .sub-group:first-of-type {
            margin-top: 0;
        }
        .dark .sub-group {
            color: #60a5fa;
            border-bottom-color: #3b82f6;
        }
        .dark .sub-group::before {
            color: #3b82f6;
        }
        @media (min-width: 640px) {
            .sub-group {
                font-size: 11px;
                padding: 10px 4px 5px 4px;
                gap: 10px;
            }
            .sub-group::before {
                font-size: 11px;
            }
        }

        .section-padding {
            padding: 14px;
        }
        @media (min-width: 640px) {
            .section-padding {
                padding: 20px;
            }
        }
        .section-padding-top {
            padding-top: 0;
        }
        .header-wrap {
            padding: 10px 16px;
        }
        @media (min-width: 640px) {
            .header-wrap {
                padding: 14px 28px;
            }
        }

        .date-card {
            background: #fafafa;
            border-radius: 18px;
        }
        .dark .date-card {
            background: #1e293b;
        }
    </style>
</head>
<body class="bg-[#f4f6f9] dark:bg-[#0a0e14] text-slate-900 dark:text-slate-100 min-h-screen transition-colors">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-white/85 dark:bg-slate-900/85 backdrop-blur-xl border-b border-slate-200/60 dark:border-slate-800/60 header-wrap shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="min-w-0">
                <h1 class="header-title">📋 Laporan Rawat Inap</h1>
                <p class="header-sub hidden sm:block">Klik <span class="font-bold text-emerald-600 dark:text-emerald-400">+</span> atau <span class="font-bold text-red-500 dark:text-red-400">−</span> untuk mengubah jumlah</p>
            </div>
            <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
                <button id="darkToggle" class="btn-dark" title="Ubah tema">🌙</button>
                <button onclick="resetAll()" class="btn-reset">🔄 Reset</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto pt-[72px] sm:pt-[88px] pb-14 px-3 sm:px-4">

        <!-- Tanggal & Jam -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-4 sm:p-6 mb-5 transition-colors date-card">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                <div>
                    <label class="label-date">📅 Tanggal Laporan</label>
                    <input type="date" id="reportDate" class="input-date" />
                </div>
                <div>
                    <label class="label-date">🕐 Jam Laporan</label>
                    <input type="time" id="reportTime" value="00:00" class="input-date" />
                </div>
            </div>
        </section>

        <!-- RAWAT JALAN IGD - DEFAULT TERTUTUP -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-4 overflow-hidden section-card">
            <div onclick="toggleSection('rjSection')" class="section-header flex items-center justify-between p-3.5 sm:p-5">
                <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                    <span class="text-2xl sm:text-3xl flex-shrink-0">🏥</span>
                    <h2 class="font-extrabold text-xs sm:text-sm uppercase tracking-wider text-slate-700 dark:text-slate-200 truncate">Rawat Jalan IGD</h2>
                    <span class="badge-total" id="rjTotal">0</span>
                </div>
                <svg id="arrow-rjSection" class="toggle-arrow w-4 h-4 sm:w-5 sm:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
            </div>
            <div id="content-rjSection" class="collapsible-content section-padding section-padding-top">
                <div class="grid-items" id="rjContainer"></div>
            </div>
        </section>

        <!-- RAWAT INAP MRS - DEFAULT TERTUTUP -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-4 overflow-hidden section-card">
            <div onclick="toggleSection('mrsSection')" class="section-header flex items-center justify-between p-3.5 sm:p-5">
                <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                    <span class="text-2xl sm:text-3xl flex-shrink-0">🛏️</span>
                    <h2 class="font-extrabold text-xs sm:text-sm uppercase tracking-wider text-slate-700 dark:text-slate-200 truncate">Rawat Inap (MRS)</h2>
                    <span class="badge-total green" id="mrsTotal">0</span>
                </div>
                <svg id="arrow-mrsSection" class="toggle-arrow w-4 h-4 sm:w-5 sm:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
            </div>
            <div id="content-mrsSection" class="collapsible-content section-padding section-padding-top">
                <div class="grid-items" id="mrsContainer"></div>
            </div>
        </section>

        <!-- KETERANGAN MRS - DEFAULT TERTUTUP -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-4 overflow-hidden section-card">
            <div onclick="toggleSection('ketMrsSection')" class="section-header flex items-center justify-between p-3.5 sm:p-5">
                <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                    <span class="text-2xl sm:text-3xl flex-shrink-0">📝</span>
                    <h2 class="font-extrabold text-xs sm:text-sm uppercase tracking-wider text-slate-700 dark:text-slate-200 truncate">Keterangan MRS</h2>
                </div>
                <svg id="arrow-ketMrsSection" class="toggle-arrow w-4 h-4 sm:w-5 sm:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
            </div>
            <div id="content-ketMrsSection" class="collapsible-content section-padding section-padding-top">
                <div class="grid-items" id="keteranganMrsContainer"></div>
            </div>
        </section>

        <!-- KRS - DEFAULT TERTUTUP -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-5 overflow-hidden section-card">
            <div onclick="toggleSection('krsSection')" class="section-header flex items-center justify-between p-3.5 sm:p-5">
                <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                    <span class="text-2xl sm:text-3xl flex-shrink-0">📤</span>
                    <h2 class="font-extrabold text-xs sm:text-sm uppercase tracking-wider text-slate-700 dark:text-slate-200 truncate">KRS (Keluar Rawat Inap)</h2>
                    <span class="badge-total purple" id="krsTotal">0</span>
                </div>
                <svg id="arrow-krsSection" class="toggle-arrow w-4 h-4 sm:w-5 sm:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
            </div>
            <div id="content-krsSection" class="collapsible-content section-padding section-padding-top">
                <div class="grid-items" id="krsContainer"></div>
            </div>
        </section>

        <!-- OUTPUT - TETAP TERBUKA -->
        <section class="bg-slate-900 dark:bg-black rounded-2xl shadow-xl overflow-hidden border border-slate-800 transition-colors">
            <div class="px-4 py-3 sm:px-6 sm:py-4 bg-slate-800 dark:bg-slate-950 border-b border-slate-700 flex justify-between items-center gap-3 flex-wrap">
                <h3 class="text-white font-bold text-xs sm:text-sm uppercase tracking-wider">📄 Preview Laporan</h3>
                <button onclick="copyReport()" class="btn-copy">📋 Salin</button>
            </div>
            <div class="p-3 sm:p-4">
                <div id="outputReport" class="output-box">Silakan isi data di atas untuk menghasilkan laporan...</div>
            </div>
        </section>

    </main>

    <!-- Toast -->
    <div id="toast" class="toast">
        <span id="toastMsg">✅ Tersalin!</span>
    </div>

    <script>
        // ==================== DATA KONFIGURASI ====================

        const RJ_ITEMS = [
            'BPJS', 'Umum', 'Jasa Raharja', 'BPJS TK',
            'Jaya Mestika', 'AdMedika', 'Sinarmas', 'PT. PP'
        ];

        const MRS_GROUPS = [{
            label: 'BPJS',
            items: ['BPJS', 'BPJSTK']
        }, {
            label: 'Umum',
            items: ['Umum']
        }, {
            label: 'Asuransi',
            items: ['AdMedika', 'Prudential', 'Jasa Raharja', 'CJ Feed', 'PT Jaya Mestika', 'PT Penta', 'Ajinomoto', 'Sinarmas', 'Reliance', 'Allianz']
        }];

        const KET_MRS_GROUPS = [{
            label: 'BPJS',
            items: ['BPJS PBI', 'BPJS Mandiri Kelas 1', 'BPJS Mandiri Kelas 2', 'BPJS Mandiri Kelas 3', 'BPJS TK']
        }, {
            label: 'BPJS Naik Kelas',
            items: ['BPJS 1 ke VIP', 'BPJS 2 ke VIP', 'BPJS 2 ke 1']
        }, {
            label: 'Umum',
            items: ['Umum VVIP', 'Umum VIP', 'Umum Kelas 1', 'Umum Kelas 2', 'Umum Kelas 3', 'Umum ICU', 'Umum HCU', 'Umum PICU', 'Umum NICU']
        }, {
            label: 'Asuransi',
            items: ['Jampersal', 'Prudential', 'AdMedika', 'Jasa Raharja', 'Ajinomoto', 'CJ Feed', 'Covid', 'PT Jaya Mestika', 'PT Penta', 'Sinarmas', 'Reliance', 'Allianz']
        }];

        const KRS_GROUPS = [{
            label: 'BPJS',
            items: ['BPJS PBI', 'BPJS Mandiri kelas 1', 'BPJS Mandiri Kelas 2', 'BPJS Mandiri Kelas 3', 'BPJS TK']
        }, {
            label: 'BPJS Naik Kelas',
            items: ['BPJS 1 ke VIP', 'BPJS 2 ke VIP', 'BPJS 2 ke 1']
        }, {
            label: 'Umum',
            items: ['Umum VVIP', 'Umum VIP', 'Umum ICU', 'Umum HCU', 'Umum PICU', 'Umum NICU', 'Umum Kelas 1', 'Umum Kelas 2', 'Umum Kelas 3', 'Perinatologi']
        }, {
            label: 'Asuransi',
            items: ['Jasa Raharja', 'AdMedika', 'Allianz', 'Prudential', 'Sinarmas', 'CJ Feed', 'PT Jaya Mestika', 'PT Penta', 'Ajinomoto', 'Reliance']
        }];

        // ==================== STATE ====================
        let state = {
            rj: {},
            mrs: {},
            ketMrs: {},
            krs: {}
        };

        function initState() {
            RJ_ITEMS.forEach(k => state.rj[k] = 0);
            MRS_GROUPS.forEach(g => g.items.forEach(k => state.mrs[k] = 0));
            KET_MRS_GROUPS.forEach(g => g.items.forEach(k => state.ketMrs[k] = 0));
            KRS_GROUPS.forEach(g => g.items.forEach(k => state.krs[k] = 0));
        }
        initState();

        // ==================== TOGGLE SECTION ====================
        window.toggleSection = function(id) {
            const content = document.getElementById('content-' + id);
            const arrow = document.getElementById('arrow-' + id);
            if (!content || !arrow) return;
            content.classList.toggle('expanded');
            arrow.classList.toggle('rotated');
        };

        // ==================== RENDER ====================
        function renderGrouped(containerId, groups, stateKey, totalId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            let html = '';
            groups.forEach((group) => {
                html += `<div class="sub-group">${group.label}</div>`;
                group.items.forEach(key => {
                    const val = state[stateKey][key] || 0;
                    html += `
                        <div class="item-box">
                            <span class="item-label">${key}</span>
                            <button onclick="adjust('${stateKey}','${key}',-1)" class="counter-btn minus">−</button>
                            <span class="value-display" id="val-${stateKey}-${key}">${val}</span>
                            <button onclick="adjust('${stateKey}','${key}',1)" class="counter-btn plus">+</button>
                        </div>
                    `;
                });
            });
            container.innerHTML = html;
            updateTotal(stateKey, totalId);
        }

        function renderSimple(containerId, items, stateKey, totalId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            let html = '';
            items.forEach(key => {
                const val = state[stateKey][key] || 0;
                html += `
                    <div class="item-box">
                        <span class="item-label">${key}</span>
                        <button onclick="adjust('${stateKey}','${key}',-1)" class="counter-btn minus">−</button>
                        <span class="value-display" id="val-${stateKey}-${key}">${val}</span>
                        <button onclick="adjust('${stateKey}','${key}',1)" class="counter-btn plus">+</button>
                    </div>
                `;
            });
            container.innerHTML = html;
            updateTotal(stateKey, totalId);
        }

        function updateTotal(stateKey, totalId) {
            if (!totalId) return;
            const total = Object.values(state[stateKey]).reduce((a, b) => a + b, 0);
            const el = document.getElementById(totalId);
            if (el) {
                el.textContent = total;
                el.style.transform = 'scale(1.15)';
                setTimeout(() => el.style.transform = 'scale(1)', 200);
            }
        }

        // ==================== ADJUST ====================
        window.adjust = function(stateKey, key, delta) {
            if (state[stateKey][key] === undefined) return;
            const newVal = Math.max(0, (state[stateKey][key] || 0) + delta);
            state[stateKey][key] = newVal;
            const el = document.getElementById(`val-${stateKey}-${key}`);
            if (el) el.textContent = newVal;

            const map = { rj: 'rjTotal', mrs: 'mrsTotal', ketMrs: null, krs: 'krsTotal' };
            updateTotal(stateKey, map[stateKey]);
            generateReport();
            saveToLocalStorage();
        };

        // ==================== GENERATE LAPORAN ====================
        function generateReport() {
            const date = document.getElementById('reportDate').value;
            const time = document.getElementById('reportTime').value || '00.00';
            const fd = date ? date.split('-').reverse().join(' - ') : ' -  - ';

            const tRJ = Object.values(state.rj).reduce((a, b) => a + b, 0);
            const tMRS = Object.values(state.mrs).reduce((a, b) => a + b, 0);
            const tKRS = Object.values(state.krs).reduce((a, b) => a + b, 0);
            const tAll = tRJ + tMRS;

            let r = `*Laporan Rawat Inap tanggal ${fd} per jam ${time} WIB*\n\n`;
            r += `*Total Keseluruhan Kunjungan : ${tAll} pasien*\n\n`;
            r += `*Pasien Rawat Jalan IGD : ${tRJ} pasien*\n👇\n\nDengan Rincian :\n`;
            RJ_ITEMS.forEach(k => r += `${k} : ${state.rj[k] || 0} pasien\n`);

            r += `\n*Total Pasien Rawat Inap : ${tMRS} pasien*\n\n`;
            r += `*Pasien MRS tanggal ${fd} : ${tMRS} pasien* \n👇\n\nDengan Rincian :\n`;
            MRS_GROUPS.forEach(g => g.items.forEach(k => r += `${k} : ${state.mrs[k] || 0}\n`));

            r += `\nKeterangan\n`;
            KET_MRS_GROUPS.forEach(g => g.items.forEach(k => r += `${k} : ${state.ketMrs[k] || 0}\n`));

            r += `\n*Pasien KRS tanggal ${fd} : ${tKRS} pasien*\n👇\n\nKeterangan\n`;
            KRS_GROUPS.forEach(g => g.items.forEach(k => r += `${k} : ${state.krs[k] || 0}\n`));

            document.getElementById('outputReport').textContent = r;
        }

        // ==================== COPY ====================
        window.copyReport = function() {
            const text = document.getElementById('outputReport').textContent;
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Laporan tersalin!');
            }).catch(() => {
                const area = document.createElement('textarea');
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                document.body.removeChild(area);
                showToast('📋 Laporan tersalin!');
            });
        };

        // ==================== TOAST ====================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ==================== RESET ====================
        window.resetAll = function() {
            if (!confirm('⚠️ Reset semua data?')) return;
            initState();
            renderAll();
            generateReport();
            saveToLocalStorage();
            showToast('🔄 Semua data direset');
        };

        // ==================== RENDER ALL ====================
        function renderAll() {
            renderSimple('rjContainer', RJ_ITEMS, 'rj', 'rjTotal');
            renderGrouped('mrsContainer', MRS_GROUPS, 'mrs', 'mrsTotal');
            renderGrouped('keteranganMrsContainer', KET_MRS_GROUPS, 'ketMrs', null);
            renderGrouped('krsContainer', KRS_GROUPS, 'krs', 'krsTotal');
        }

        // ==================== LOCAL STORAGE ====================
        function saveToLocalStorage() {
            try {
                localStorage.setItem('laporanRawatInap', JSON.stringify(state));
            } catch (e) {}
        }

        function loadFromLocalStorage() {
            try {
                const data = localStorage.getItem('laporanRawatInap');
                if (!data) return;
                const parsed = JSON.parse(data);
                RJ_ITEMS.forEach(k => { if (parsed.rj?.[k] !== undefined) state.rj[k] = parsed.rj[k]; });
                MRS_GROUPS.forEach(g => g.items.forEach(k => { if (parsed.mrs?.[k] !== undefined) state.mrs[k] = parsed.mrs[k]; }));
                KET_MRS_GROUPS.forEach(g => g.items.forEach(k => { if (parsed.ketMrs?.[k] !== undefined) state.ketMrs[k] = parsed.ketMrs[k]; }));
                KRS_GROUPS.forEach(g => g.items.forEach(k => { if (parsed.krs?.[k] !== undefined) state.krs[k] = parsed.krs[k]; }));
                renderAll();
                generateReport();
            } catch (e) {}
        }

        // ==================== DARK MODE ====================
        const darkToggle = document.getElementById('darkToggle');
        darkToggle.addEventListener('click', function() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            this.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            darkToggle.textContent = '☀️';
        }

        // ==================== EVENTS ====================
        document.getElementById('reportDate').addEventListener('change', generateReport);
        document.getElementById('reportTime').addEventListener('change', generateReport);
        document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];

        // ==================== INIT ====================
        loadFromLocalStorage();
        renderAll();
        generateReport();
    </script>
</body>
</html>
